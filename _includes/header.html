<!-- Header -->
<header id="doc_header">
  <div class="container" id="header_container">
    <div class="row">
      <div class="col-lg-12">
        <div class="radial">
          <a href="#about" class="radial_url">
            <button rel="noopener" class="fa fa-solid fa-person fa-3x" id="fa-1" data-toggle="tooltip" data-placement="top" title="About Me"></button>
          </a>
          <a href="#roles" class="radial_url">
            <button rel="noopener" class="fa fa-solid fa-briefcase fa-3x" id="fa-2" data-toggle="tooltip" data-placement="top" title="Roles"></button>
          </a>
          <a href="/files/SasCV.pdf" target="_blank" rel="noopener" class="radial_url" id="cvLink" data-profession-cv aria-label="CV">
            <button rel="noopener" class="fa fa-solid fa-file fa-3x" id="fa-3" data-toggle="tooltip" data-placement="top" title="CV" aria-label="CV"></button>
           </a>
           <a href="#portfolio" class="radial_url">
            <button rel="noopener" class="fa fa-solid fa-atom fa-3x" id="fa-4" data-toggle="tooltip" data-placement="top" title="Projects"></button>
           </a>
          <button class="fab logo">
            <div class="fa fa-3x" id="logoradial"></div>
          </button>
        </div>
        
        <div class="intro-text">
          <span class="name">{{ site.title }}</span>
          <hr class="star-light" />
          <span class="skills">{{ site.skills }}</span>
          <span class="tagline">{{ site.tagline }}</span>
          <br>
          <span class="socials d-flex "> 
            <a href="{{ site.links.github }}" class="btn-social btn-outline"><i class="fab fa-github"></i></a>
            <a href="{{ site.links.linkedin }}" class="btn-social btn-outline"><i class="fab fa-linkedin"></i></a>
            <a href="{{ site.links.facebook }}" class="btn-social btn-outline"><i class="fab fa-facebook"></i></a>
            <a href="{{ site.links.devpost }}" class="btn-social btn-outline"><i class="fa-solid fa-trophy"></i></a>
            <a href="{{ site.links.stackoverflow }}" class="btn-social btn-outline"><i class="fab fa-stack-overflow"></i></a>
          </span>
        </div>
      </div>
    </div>
  </div>
</header>
