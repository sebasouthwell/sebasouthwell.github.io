<!-- Contact Popup Widget -->
<div class="contact-popup" id="contactPopup">
  <button type="button" class="contact-popup-toggle" id="contactPopupToggle" aria-expanded="false" aria-controls="contactPopupPanel">
    <span class="contact-popup-toggle-icon"><i class="fa fa-solid fa-comment-dots"></i></span>
    <span class="contact-popup-toggle-label">Message me</span>
  </button>

  <div class="contact-popup-panel" id="contactPopupPanel" hidden>
    <div class="contact-popup-header">
      <h3>Get in touch</h3>
      <button type="button" class="contact-popup-close" id="contactPopupClose" aria-label="Close contact form">&times;</button>
    </div>

    <form action="https://n8n.sebasouthwell.co.uk/webhook/contact-me/portfolio" method="POST" name="sentMessage" id="contactForm" novalidate>
      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" name="name" class="form-control" placeholder="Name" id="name" required
          data-validation-required-message="Please enter your name.">
        <p class="help-block text-danger"></p>
      </div>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" name="email" class="form-control" placeholder="Email Address" id="email" required
          data-validation-required-message="Please enter your email address.">
        <p class="help-block text-danger"></p>
      </div>
      <div>
        <input type="hidden" name="subject" value="New submission!">
        <input type="text" name="website" style="display:none" tabindex="-1" autocomplete="off" />
      </div>
      <div class="form-group">
        <label for="message">Message</label>
        <textarea rows="4" name="message" class="form-control" placeholder="Message" id="message" required
          data-validation-required-message="Please enter a message."></textarea>
        <p class="help-block text-danger"></p>
        <span class="contact-popup-help">e.g. "Hi Sebastian, I'm hiring for a DevOps role and wanted to ask about your AWS experience."</span>
      </div>
      <div class="contact-popup-actions">
        <button type="submit" class="btn btn-success">
          <i class="fa fa-solid fa-bolt"></i> Send Instant DM
        </button>
        <a href="mailto:{{ site.email }}" class="btn btn-default" id="contactPopupEmailBtn" data-email="{{ site.email }}">
          <i class="fa fa-solid fa-envelope"></i> Email Instead
        </a>
      </div>
    </form>

    <div class="contact-popup-success" id="contactPopupSuccess" hidden>
      <i class="fa fa-solid fa-circle-check"></i>
      <p>Message sent!</p>
    </div>
    <div class="contact-popup-error" id="contactPopupError" hidden>
      <p>Something went wrong — please try again in a moment.</p>
    </div>
  </div>
</div>
