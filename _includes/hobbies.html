<!-- Hobbies Section -->
<section id="hobbies" class="success">
  <div class="container">
    <div class="row">
      <div class="col-lg-12 text-center">
        <h2>Extracurricular</h2>
        <hr class="star-light">
      </div>
    </div>
    <div class="row">
      <div class="col-lg-10 col-lg-offset-1">
        <div class="hobbies-alt-list">
          {% for hobby in site.data.hobbies %}
          <div class="hobbies-alt-item">
            <div class="hobbies-alt-media"><i class="{{ hobby.icon }}"></i></div>
            <div class="hobbies-alt-text">
              <h3>{{ hobby.title }}</h3>
              <p>{{ hobby.description }}</p>
            </div>
          </div>
          {% endfor %}
        </div>
      </div>
    </div>
  </div>
</section>
