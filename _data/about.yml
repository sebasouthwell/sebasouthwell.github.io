- heading: Who am I?
  image: img/profile.jpg
  imageAlt: Sebastian Southwell
  paragraphs:
    - html: <p>I'm Sebastian Southwell, a multidisciplinary software and systems engineer with a First-Class MComp in Computer Science from the University of Sheffield (2025). Currently a DevOps Engineer at the UK Home Office, I care about building impactful, scalable systems that are modular, dynamic and user-friendly. I'm particularly interested in proof-of-concept and prototype design, artificial intelligence and emerging technologies. My academic work includes leading master's-level research into reducing hallucinations in large language models (LLMs), as well as shaping the design and strategy of a start-up development project.</p>
    - html: <p>Outside my professional work, I've contributed to a wide range of projects and technical communities. I attended HackSheffield 7 through 9 and won prizes at each event, collaborating with people at different levels of experience. At university, I held technical, leadership and presentation-focused roles including Technical Systems Officer, Technical Events Officer, Inclusions Officer and Lead Imaging Systems Engineer for a student-led UAV project.<br><br>I'm also an active member of the Sheffield community and take part in a variety of local events and activities. I've been partner dancing for two years and competed at IVDC Blackpool in 2025.</p>
