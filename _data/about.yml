- heading: Who am I?
  image: img/profile.jpg
  imageAlt: Sebastian Southwell
  paragraphs:
    - html: <p>I'm Sebastian Southwell, a multidisciplinary software and systems engineer with a First-Class MComp in Computer Science from the University of Sheffield. Currently a DevOps Engineer at the UK Home Office, I build reliable, scalable systems and am particularly interested in platform engineering, applied AI and proof-of-concept development. My academic work includes leading master's-level research into reducing hallucinations in large language models and shaping the design and strategy of a start-up development project.</p>
    - html: <p>Outside work, I've contributed to a wide range of projects and technical communities. I won prizes at HackSheffield 7, 8 and 9 and held several university leadership positions, including Technical Systems Officer, Technical Events Officer, Inclusions Officer and Lead Imaging Systems Engineer for a student-led UAV project.<br><br>I'm also active in the Sheffield community, have been partner dancing for two years and competed at IVDC Blackpool in 2025.</p>
