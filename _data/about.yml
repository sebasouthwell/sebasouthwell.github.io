- heading: Who am I?
  image: img/profile.jpg
  imageAlt: Sebastian Southwell
  paragraphs:
    - html: <p>I'm Sebastian Southwell, a DevOps Engineer at the UK Home Office and a First-Class MComp Computer Science graduate from the University of Sheffield (2025). I care about building impactful and scalable systems, that are modular, dynamic and user-friendly, with a particular interest in proof-of-concept/prototyping design, artificial intelligence and emerging technologies. Examples of this include various academic projects of which I have led master's level research into LLM (Large Language Model) Hallucination reduction and the design and strategy for a start-up development project.</p>
    - html: <p>Outside my professional work, I've also worked on a large number of projects, and have actively participated in technical communities. I've attended and won prizes at HackSheffield 7 through 9, working with individuals of various experience, alongside working in various technical, leadership and presentation based roles during my time in University, being a Technical Systems Officer, Technical Events Officer, Inclusions Officer and also a Lead Imaging Systems Engineer (for a student-led UAV project).<br><br>As a little aside however, I'm also a active member of the Sheffield community and participate in many events and activities including that of partner dancing, of which I have been doing for 2 years, and competed at the IVDC Blackpool 2025.</p>
  ctaLabel: My project roster
  ctaHref: '#portfolio'
