    - profession: all
      intro: 'First-Class MComp graduate whose degree centred on three major projects:'
      bullets:
        - html: <strong><a href="http://www.dcs.shef.ac.uk/intranet/teaching/public/modules/level4/com4520.html" target="_blank" rel="noopener">Darwin (BDUK)</a></strong> — System Architecture lead on a graph-verified RAG assistant mitigating hallucinations in multi-modal LLMs, built for government body Building Digital UK (74%).
        - html: <strong>Dissertation</strong> — a physical smart-home voice assistant on the University of Sheffield's unPhone hardware platform, combining LLMs, speech processing and IoT, supervised by Professor Hamish Cunningham (78%).
        - html: <strong><a href="http://www.dcs.shef.ac.uk/intranet/teaching/public/modules/level4/com4525.html" target="_blank" rel="noopener">Genesys</a></strong> — a Ruby on Rails career-guidance platform for University of Sheffield spinout <a href="https://www.epigenesys.org.uk/" target="_blank" rel="noopener">epiGenesys</a>, covering the full product lifecycle from customer interviews, personas and pain-point/experience mapping through to a business model and the build itself — praised for its testing, security and performance engineering (75%).
      outro: Alongside the technical curriculum, <strong>Finance and Law for Engineers</strong> (88%) covered financial statement literacy (income statement, balance sheet, cash flow), UK company law and audit regulation, and pricing strategy grounded in demand economics — the commercial and legal literacy behind the engineering.
    - profession: ai
      intro: 'First-Class MComp graduate with a strong AI focus spanning real projects, practicals and theory:'
      bullets:
        - html: '<strong><a href="http://www.dcs.shef.ac.uk/intranet/teaching/public/modules/level4/com4520.html" target="_blank" rel="noopener">Darwin (BDUK)</a></strong> — System Architecture lead on "Mitigating Hallucinations in Multi-Modal LLMs: A Graph-Verified Retrieval Assistant for Government Data," combining dual embedding models (local CLIP, cloud-based Amazon Titan) and two document-verification approaches, benchmarked across 275 configurations (74%).'
        - html: <strong>Dissertation</strong> — a physical smart-home voice assistant on the unPhone hardware platform, combining LLM-driven command generation, speech processing (recognition and synthesis, with wake-word detection researched but not reliably implemented), and a Flask/Redis cloud backend, supervised by Professor Hamish Cunningham (78%).
        - html: <strong><a href="http://www.dcs.shef.ac.uk/intranet/teaching/public/modules/level3/com3502.html" target="_blank" rel="noopener">Speech Processing</a></strong> (80%) — built custom digital filters and a suite of DSP-based voice effects from scratch in Python (tremolo, ring modulation, frequency shifting, vibrato, echo, comb filtering, a flanger, and a cascaded equaliser).
        - html: <strong><a href="http://www.dcs.shef.ac.uk/intranet/teaching/public/modules/level4/com4511.html" target="_blank" rel="noopener">Speech Technology</a></strong> (73%) — chose keyword search (information retrieval over spoken audio) and a review of the DIHARD speaker diarisation challenges as practicals, from a curriculum covering MFCCs, HMMs and other graphical models, Gaussian Mixture Models, and n-gram language models.
        - html: '<strong>Machines and Intelligence</strong> (72%) — my first AI module: implemented A* and Branch and Bound search in Java for "The Rambler''s Problem," then wrote a batch-automation harness plus a separate C# analysis tool to run around 6,885 systematic test variants comparing how heuristic weighting affected search efficiency.'
        - html: <strong>Text Processing</strong> (63%) — built a TF-IDF-based document retrieval system, alongside labs in Chinese word segmentation and part-of-speech tagging.
        - html: '<strong>Data Driven Computing</strong> — a full pattern-recognition and machine learning curriculum studied in depth: Bayesian decision theory, linear classifiers and the Perceptron, k-nearest-neighbour classification, PCA/LDA-based dimensionality reduction via eigenvectors, and deep learning through to CNNs and RNNs.'
      outro: ''
