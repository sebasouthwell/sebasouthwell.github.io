# Site settings
title: Sebastian Southwell
email: sas@sebasouthwell.co.uk
url: https://sebasouthwell.co.uk
description: "The portfolio website of Sebastian Southwell"
keywords: "DevOps Engineer, Software Engineer, Full-Stack Developer, Ruby, Python, Sheffield"
skills: "Multidisciplinary Software, Systems & DevOps Engineer"
tagline: "Cloud · Software · AI · Hardware"
asset_version: "20260725-5"
meta_author: Southwell Sebastian

# Google webmaster tools
google_verify:

# https://ssl.bing.com/webmaster/configure/verify/ownership Option 2 content= goes here
bing_verify:

# Contact form:
# - static : pass through formspree.io to validate email sending
# - disqus : replace contact form by disqus thread
# - comment the line below if you want to stick with the default PHP contact form
contact: static

# If you use disqus you need disqus shortname
# https://help.disqus.com/customer/portal/articles/466208
disqus_shortname: myshortname

# Color settings (hex-codes without the leading hash-tag)
color:
  primary: 6a0077 #80B3FF
  primary-rgb: "24,288,156" #"128,179,255"
  secondary: 6a0077 #FD6E8A
  secondary-dark: 420649 #A2122F

# Footer settings
footer:
  copyright: Sebastian Southwell
  location: Location
  social: Around the Web
  credits: Credits

# Social networks usernames (many more available: google-plus, flickr, dribbble, pinterest, instagram, tumblr, linkedin, etc.)
social:
  - title: github
    url: https://github.com/sebasouthwell
  - title: linkedin
    url: https://www.linkedin.com/in/sebasouthwell/
  - title: facebook
    url: https://www.facebook.com/SebNeedsABetterUsername
  - title: stack-overflow
    url: https://stackoverflow.com/users/8808818/sebastian-southwell

links:
  github: https://github.com/sebasouthwell
  linkedin: https://www.linkedin.com/in/sebasouthwell/
  facebook: https://www.facebook.com/SebNeedsABetterUsername
  devpost: https://devpost.com/sebastian-southwell 
  stackoverflow: https://stackoverflow.com/users/8808818/sebastian-southwell



# Postal address (add as many lines as necessary)
address:
  - line: Sheffield, United Kingdom

# Credits content
credits: 'Freelancer is a free to use, open source Bootstrap theme created by <a href="http://startbootstrap.com">Start Bootstrap</a>.'

# Build settings
markdown: kramdown
permalink: pretty

#for posts
# Portfolio posts are only ever rendered via modal popup (see _includes/modals.html),
# not as standalone pages, so skip writing them to _site/ entirely. Without this,
# every post plus index.html previously collided at the same output path.
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      output: false
